<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 446" width="700" height="446"
     role="img" aria-label="전량 변환이 139.3초에서 27.5초로 줄었고, 줄어든 시간의 대부분은 같은 일을 두 번 하지 않게 한 것에서 나왔습니다">
  <title>전량 변환의 소요 시간</title>
  <desc>139.3초였던 전량 변환이 27.5초가 되었습니다. 단계별로는 임포트 21.9→6.6초, 쿠킹 45.7→5.5초, 출력 61.0→8.2초, 커밋 9.4→5.9초입니다. 줄어든 111.7초 중 90.1초는 같은 일을 두 번 하던 자리를 고쳐서, 나머지는 병렬화로 나왔습니다. 출력은 한 바이트도 바뀌지 않았습니다.</desc>

  <style>
    /*
      Colours are GitHub's own, with a dark override - the file is served as an image,
      so the query follows the viewer's system theme.
    */
    .head  { fill: #1f2328; font-weight: 600; }
    .note  { fill: #59636e; }
    .lab   { fill: #59636e; }
    .was   { fill: #d1d9e0; }
    .wast  { fill: #59636e; }
    .now   { fill: #1f883d; }
    .nowt  { fill: #1a7f37; font-weight: 600; }
    .big   { fill: #1a7f37; font-weight: 700; }
    .waste { fill: #0969da; }
    .threads { fill: #8250df; }
    .on    { fill: #ffffff; font-weight: 600; }
    .chip  { fill: #dafbe1; stroke: #4ac26b; }
    .okx   { fill: #1a7f37; font-weight: 600; }
    .rule  { stroke: #d1d9e0; }

    @media (prefers-color-scheme: dark) {
      .head  { fill: #f0f6fc; }
      .note  { fill: #9198a1; }
      .lab   { fill: #9198a1; }
      .was   { fill: #3d444d; }
      .wast  { fill: #9198a1; }
      .now   { fill: #3fb950; }
      .nowt  { fill: #3fb950; }
      .big   { fill: #3fb950; }
      .waste { fill: #4493f8; }
      .threads { fill: #ab7df8; }
      .chip  { fill: #0f2417; stroke: #2ea043; }
      .okx   { fill: #3fb950; }
      .rule  { stroke: #3d444d; }
    }

    text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .t34 { font-size: 34px; }
    .t17 { font-size: 17px; }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; }
    .t10 { font-size: 10px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>

