<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     role="img" aria-label="시트에서 산출물까지의 한 방향 흐름. 임포터가 셀 격자를 만들고, 레이아웃 파서가 그것을 모델로 옮기고, 쿠킹이 값과 타입과 이름을 정하고, 검증 게이트를 지난 뒤에야 타깃들이 산출물을 냅니다. 프로젝트를 아는 코드는 레이아웃 파서 한 자리뿐입니다.">
  <title>변환 파이프라인 — 시트에서 산출물까지</title>
  <desc>소스(엑셀·구글 스프레드시트·.tbs 선언)를 임포터가 읽어 셀 격자를 만듭니다. 레이아웃 파서가 그 격자를 모델로 옮기는데, 이 한 자리만 프로젝트의 시트 규칙을 알고 어트리뷰트 스캔으로 발견되므로 코어에 등록 코드가 없습니다. 쿠킹이 값과 타입과 이름 규칙을 한 곳에서 정하고, 검증 게이트가 모든 타깃보다 앞에 서서 실패한 실행이 파일에도 데이터베이스에도 흔적을 남기지 않게 합니다. 통과하면 타깃들이 각자 산출물을 냅니다. 바이너리 형식을 정의하는 코드는 TcbWriter 하나이고, 그것을 구현하는 테이블 리더는 언어마다 하나씩 lib 아래에 있으며, 적합성 코퍼스가 그 둘이 어긋나지 않는지 확인합니다.</desc>

  <style>
    /*
      이 그림이 말하는 것은 단계의 나열이 아니라 두 가지입니다.

      하나 - 프로젝트를 아는 코드가 어디까지인가. 임포터는 셀만 만들고 그 아래는 모델만
      보므로, 시트 규칙을 아는 자리는 레이아웃 파서 하나입니다. 그 파일을 지웠을 때
      코어에 흔적이 남으면 설계가 잘못된 것입니다.

      둘 - 게이트가 어디에 서 있는가. 검증이 모든 타깃보다 앞이라서, 실패한 실행은
      파일에도 데이터베이스에도 아무것도 남기지 않습니다.

      Colours are GitHub's own, with a dark override - served as an image, so the query
      follows the viewer's system theme.
    */
    .src    { fill: #ffffff; stroke: #d1d9e0; }
    .core   { fill: #ddf4ff; stroke: #54aeff; }
    .plugin { fill: #fff8c5; stroke: #d4a72c; }
    .gate   { fill: #ffebe9; stroke: #ff8182; }
    .out    { fill: #dafbe1; stroke: #4ac26b; }
    .step   { fill: #1f2328; font-weight: 600; }
    .note   { fill: #59636e; }
    .flow   { stroke: #9aa4b2; fill: none; }
    .arrow  { fill: #9aa4b2; }
    .band   { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 3; }

    @media (prefers-color-scheme: dark) {
      .src    { fill: #151b23; stroke: #3d444d; }
      .core   { fill: #0c2d6b; stroke: #388bfd; }
      .plugin { fill: #3a2d0b; stroke: #d29922; }
      .gate   { fill: #4c1a1a; stroke: #f85149; }
      .out    { fill: #0f2f1a; stroke: #3fb950; }
      .step   { fill: #f0f6fc; }
      .note   { fill: #9198a1; }
      .flow   { stroke: #6a7381; }
      .arrow  { fill: #6a7381; }
      .band   { stroke: #3d444d; }
    }

    text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      text-anchor: middle;
    }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; }
    .t10 { font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace; }
    .left { text-anchor: start; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" class="arrow"/>
    </marker>
  </defs>

  <text x="440" y="24" class="t13 step">시트를 아는 자리는 레이아웃 파서 하나이고, 검증은 모든 타깃보다 앞입니다</text>

  <!-- 1. 소스 -->
  <rect x="16" y="52" width="150" height="96" rx="10" class="src" stroke-width="1.5"/>
  <text x="91" y="76" class="t12 step">소스</text>
  <text x="91" y="96" class="t11 note mono">.xlsx · .xlsb</text>
  <text x="91" y="113" class="t11 note">구글 스프레드시트</text>
  <text x="91" y="130" class="t11 note mono">.tbs</text>

  <!-- 2. 임포터 -->
  <rect x="196" y="52" width="150" height="96" rx="10" class="core" stroke-width="1.5"/>
  <text x="271" y="76" class="t12 step">임포터</text>
  <text x="271" y="96" class="t11 note">셀 격자만 만듭니다</text>
  <text x="271" y="113" class="t11 note">어느 프로젝트인지 모릅니다</text>
  <text x="271" y="130" class="t11 note mono">RawCell</text>

  <!-- 3. 레이아웃 파서 - 플러그인 -->
  <rect x="376" y="52" width="150" height="96" rx="10" class="plugin" stroke-width="1.5"/>
  <text x="451" y="76" class="t12 step">레이아웃 파서</text>
  <text x="451" y="96" class="t11 note mono">[TabbitLayout]</text>
  <text x="451" y="113" class="t11 note">격자 → 모델</text>
  <text x="451" y="130" class="t11 note">여기만 시트 규칙을 압니다</text>

  <!-- 4. 쿠킹 + 모델 -->
  <rect x="556" y="52" width="150" height="96" rx="10" class="core" stroke-width="1.5"/>
  <text x="631" y="76" class="t12 step">쿠킹 → Model</text>
  <text x="631" y="96" class="t11 note">값 · 타입 · 이름 규칙</text>
  <text x="631" y="113" class="t11 note">한 곳에서 정합니다</text>
  <text x="631" y="130" class="t11 note">테이블 · enum · 상수셋</text>

  <path d="M 166 100 L 190 100" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 346 100 L 370 100" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 526 100 L 550 100" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 플러그인임을 말하는 주석 -->
  <text x="451" y="166" class="t10 note">어트리뷰트 스캔으로 발견 — 코어에 등록 코드가 없습니다</text>

  <!-- 5. 검증 게이트 -->
  <rect x="556" y="196" width="150" height="66" rx="10" class="gate" stroke-width="1.5"/>
  <text x="631" y="220" class="t12 step">검증 게이트</text>
  <text x="631" y="239" class="t11 note">프로젝트의 C# 규칙</text>
  <text x="631" y="254" class="t11 note">실패하면 여기서 멈춥니다</text>

  <path d="M 631 148 L 631 190" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="726" y="176" class="t10 note left">모든 타깃보다 앞</text>

  <!-- 6. 타깃 -->
  <rect x="16" y="306" width="848" height="140" rx="12" class="band" stroke-width="1.2"/>
  <text x="440" y="292" class="t11 note">통과한 실행만 여기에 닿습니다 · 타깃은 <tspan class="mono">[TabbitTarget]</tspan> 어트리뷰트로 등록됩니다</text>

  <path d="M 631 262 L 631 300" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="36" y="330" width="185" height="96" rx="10" class="out" stroke-width="1.5"/>
  <text x="128" y="354" class="t12 step">바이너리</text>
  <text x="128" y="373" class="t11 note mono">.tcb</text>
  <text x="128" y="392" class="t11 note">형식을 정의하는 코드는</text>
  <text x="128" y="408" class="t11 note mono">TcbWriter.cs 하나</text>

  <rect x="241" y="330" width="185" height="96" rx="10" class="out" stroke-width="1.5"/>
  <text x="333" y="354" class="t12 step">언어별 코드</text>
  <text x="333" y="373" class="t11 note">접근자 · 테이블 리더</text>
  <text x="333" y="392" class="t11 note">리더의 원본은</text>
  <text x="333" y="408" class="t11 note mono">lib/&lt;언어&gt;/tabbit/</text>

  <rect x="446" y="330" width="185" height="96" rx="10" class="out" stroke-width="1.5"/>
  <text x="538" y="354" class="t12 step">사람이 보는 것</text>
  <text x="538" y="373" class="t11 note">HTML 문서 · JSON</text>
  <text x="538" y="392" class="t11 note">수집된 텍스트</text>
  <text x="538" y="408" class="t11 note">요약 · 히스토리</text>

  <rect x="651" y="330" width="185" height="96" rx="10" class="out" stroke-width="1.5"/>
  <text x="743" y="354" class="t12 step">데이터베이스</text>
  <text x="743" y="373" class="t11 note">MySQL · PostgreSQL</text>
  <text x="743" y="392" class="t11 note">MongoDB · Redis</text>
  <text x="743" y="408" class="t11 note">직접 적재</text>

  <!-- 정의 하나 vs 구현 여럿 -->
  <path d="M 128 426 L 128 440 L 333 440 L 333 426" class="flow" stroke-width="1.2"/>
  <text x="230" y="462" class="t10 note">정의 하나를 언어마다 다시 구현하므로 어긋날 수 있습니다 — 적합성 코퍼스가 그것을 봅니다</text>
</svg>
