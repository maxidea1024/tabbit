<text x="37" y="38.5" font-size="12.5" fill="#1A5FA8" font-weight="bold">:table Access</text>
<text x="141.375" y="38.5" font-size="12.5" fill="#1F2328">A flag set beside the number it becomes.</text>
<text x="37" y="62.5" font-size="12.5" fill="#1A5FA8">:field</text>
<text x="141.375" y="62.5" font-size="12.5" fill="#1F2328">index</text>
