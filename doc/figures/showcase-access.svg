<text x="141.375" y="110.5" font-size="12.5" fill="#1F2328">primary index</text>
<text x="245.75" y="110.5" font-size="12.5" fill="#1F2328">which bits</text>
<text x="340.1875" y="110.5" font-size="12.5" fill="#1F2328">the same value</text>
<text x="37" y="134.5" font-size="12.5" fill="#1A5FA8">:target</text>
