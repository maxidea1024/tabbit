apply plugin: 'com.android.application'

android {
    namespace "dev.tabbit.clover"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.tabbit.clover"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "0.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // **서명이 없는 APK 는 설치되지 않습니다.** 폰이 그것을 「앱이 설치되지 않았습니다」로
    // 거절하고, 왜인지는 화면에 적히지 않습니다 — 릴리스를 손에 쥐고 옮기는 APK 로 넘긴
    // 날부터 그 파일이 그런 것이었습니다.
    //
    // **열쇠는 저장소에 담지 않습니다.** `android/keystore.properties` 가 있으면 그것으로
    // 서명하고, 없으면 이 기계의 디버그 열쇠로 서명합니다. 디버그 열쇠는 그때까지 폰에
    // 깔려 있던 APK 를 서명한 그 열쇠이므로, **지우지 않고 덮어 설치됩니다** — 서명이
    // 다른 APK 로 덮으려 하면 폰이 같은 말로 거절합니다.
    //
    // 스토어에 올릴 것은 앞의 길로 갑니다. 그 열쇠로 처음 덮을 때는 한 번 지워야 합니다.
    signingConfigs {
        handout {
            def own = file('keystore.properties')
            def fallback = file("${System.properties['user.home']}/.android/debug.keystore")
            if (own.exists()) {
                def keys = new Properties()
                own.withInputStream { keys.load(it) }
                storeFile file(keys['storeFile'])
                storePassword keys['storePassword']
                keyAlias keys['keyAlias']
                keyPassword keys['keyPassword']
            } else if (fallback.exists()) {
                storeFile fallback
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            // **열쇠가 하나도 없는 기계에서는 서명하지 않습니다.** 없는 열쇠를 걸면 빌드가
            // 그 자리에서 실패하고, 그러면 서명이 무엇인지 모르는 사람이 APK 도 얻지
            // 못합니다 — 설치되지 않는 APK 라도 나오는 쪽이 낫습니다.
            if (signingConfigs.handout.storeFile != null) {
                signingConfig signingConfigs.handout
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// 손에 쥐고 옮길 것을 `mobile/out/` 에 베껴 둡니다.
//
// **그 자리의 이름은 `app-release.apk` 입니다** — 모듈 이름이 `app` 이라 그렇고, 그 이름에는
// 무엇의 무슨 판인지가 없습니다(서명하지 않는 기계에서는 `app-release-unsigned.apk` 입니다).
// `readme.md` 가 적어 둔 규약이 `out/clover-<판>.apk` 이고, 그것을 손으로 베끼던 것을
// 여기서 합니다.
//
// **판 번호는 여기 적지 않습니다.** `versionName` 에서 가져옵니다.
//
// **릴리스만 이름에 갈래가 없습니다.** 손에 쥐고 옮기는 것이 그것이므로 짧은 이름을 줍니다 —
// 디버그는 `-debug` 를 달아, 한 자리에 둘이 있어도 어느 것인지 이름으로 갈립니다. 짧은
// 이름을 디버그가 쓰고 있었고, 디버그를 쓰지 않게 된 뒤로 그 이름은 손에 쥐고 옮길 것이
// 아닌 쪽을 가리켰습니다.
def handout = file("${rootDir}/../out")

android.applicationVariants.all { variant ->
    def suffix = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
    // **옮기지 않고 베낍니다.** 그 자리의 것을 치우면 그 폴더를 보는 다른 도구가 없는
    // 파일을 찾습니다.
    variant.assembleProvider.configure { assemble ->
        assemble.doLast {
            copy {
                from variant.outputs.collect { it.outputFile }
                into handout
                rename { "clover-${variant.versionName}${suffix}.apk" }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
