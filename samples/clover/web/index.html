<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>clover</title>
    <style>
      /* 화면은 캔버스 하나입니다. 나머지는 그 캔버스를 가운데 두는 것뿐입니다. */
      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        height: 100%;
        background: #0b1410;
        overflow: hidden;
        font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      }

      #stage { display: block; width: 100%; height: 100%; touch-action: none; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #cfe8d6;
        letter-spacing: 0.1em;
        font-size: 14px;
        transition: opacity 240ms ease;
      }

      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot"></div>
    <script>
      // 로딩 씬.
      //
      // **씬 셋 중 첫째이고, 이 하나만 DOM 입니다.** 여기서 읽는 것 중에 글꼴이 있어서,
      // 글꼴이 있어야 그릴 수 있는 것으로는 이 화면을 그릴 수 없습니다. 나머지 둘 —
      // 타이틀과 판 — 은 `render/game.ts` 안에 있습니다.
      //
      // **글도 여기 적혀 있습니다.** 글 표를 읽기 전에 보이는 글이라 그 표에서 찾아올 수
      // 없습니다 — 대신 이 기계의 언어만 보고 고릅니다. 옵션에서 고른 것이 있으면 그것이
      // 앞섭니다. `ui/options.ts` 와 같은 열쇠입니다.
      ;(function () {
        // 읽는 차례대로 셋. `ui/boot.ts` 의 단계와 같은 순서입니다.
        var say = {
          ko: ['데이터를 읽는 중입니다', '글꼴을 읽는 중입니다', '그림을 읽는 중입니다'],
          en: ['Loading data', 'Loading fonts', 'Loading art'],
          ja: ['データを読み込んでいます', 'フォントを読み込んでいます', '画像を読み込んでいます'],
          'zh-Hans': ['正在读取数据', '正在读取字体', '正在读取图像'],
          'zh-Hant': ['正在讀取資料', '正在讀取字型', '正在讀取圖像'],
          de: ['Daten werden geladen', 'Schriften werden geladen', 'Grafiken werden geladen'],
        }

        var lang = ''
        try {
          lang = (JSON.parse(localStorage.getItem('clover.options') || '{}') || {}).language || ''
        } catch (error) {
          lang = ''
        }

        if (!say[lang]) {
          // `core/strings.ts` 의 detectLanguage 와 같은 규칙입니다. 중국어는 지역이 아니라
          // 글자로 갈립니다 — 번체를 쓰는 홍콩·마카오가 간체로 떨어지지 않게.
          var tags = (navigator.languages || [navigator.language || '']).slice()
          lang = 'en'
          for (var i = 0; i < tags.length; i++) {
            var tag = String(tags[i]).toLowerCase()
            if (tag.indexOf('ko') === 0) { lang = 'ko'; break }
            if (tag.indexOf('ja') === 0) { lang = 'ja'; break }
            if (tag.indexOf('de') === 0) { lang = 'de'; break }
            if (tag.indexOf('zh') === 0) {
              var hant = tag.indexOf('hant') >= 0 || tag.indexOf('-tw') >= 0
                || tag.indexOf('-hk') >= 0 || tag.indexOf('-mo') >= 0
              lang = hant ? 'zh-Hant' : 'zh-Hans'
              break
            }
            if (tag.indexOf('en') === 0) { lang = 'en'; break }
          }
        }

        var boot = document.getElementById('boot')
        var line = say[lang] || say.en
        boot.textContent = line[0]

        // **화면이 이 씬을 몰라도 되게 창구를 하나 둡니다.** 진입점은 「지금 몇째를 읽는
        // 중」만 알리고, 글과 다시 읽기 감시는 여기 남습니다.
        window.__boot = {
          at: function (index) { boot.textContent = line[index] || line[0] },
          fail: function (text) { boot.textContent = text },
          done: function () { boot.classList.add('gone') },
        }

        // **읽다 멈추면 멈춘 채로 두지 않습니다.** 그림 200여 장과 표 40개를 읽는 길에서
        // 하나가 답을 돌려주지 않으면 이 줄만 남아 기다리게 되고, 그것은 사람 눈에
        // 무한 루프입니다. 20초가 지나도 첫 화면이 서지 않았으면 다시 읽습니다.
        var stuck = {
          ko: '읽는 데 오래 걸립니다. 다시 읽습니다',
          en: 'Loading is slow. Retrying',
          ja: '読み込みに時間がかかっています。もう一度読み込みます',
          'zh-Hans': '读取过慢，正在重试',
          'zh-Hant': '讀取過慢，正在重試',
          de: 'Das Laden dauert. Neuer Versuch',
        }
        // 다시 읽는 것은 두 번까지입니다. **끝없이 다시 읽으면 그것이 무한 루프입니다.**
        var tries = 0
        try {
          tries = Number(sessionStorage.getItem('clover.retry') || '0') || 0
        } catch (error) {
          tries = 0
        }
        var once = false
        setTimeout(function () {
          if (once || boot.className.indexOf('gone') >= 0) return
          once = true
          if (tries >= 2) {
            boot.textContent = (stuck[lang] || stuck.en) + ' — ' + tries
            return
          }
          try {
            sessionStorage.setItem('clover.retry', String(tries + 1))
          } catch (error) {
            // 저장소가 막혀 있으면 셈을 못 합니다. 그래도 한 번은 다시 읽습니다.
          }
          boot.textContent = stuck[lang] || stuck.en
          setTimeout(function () { location.reload() }, 900)
        }, 20000)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
