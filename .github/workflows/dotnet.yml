name: .NET

# Documentation-only changes do not run this. The suite converts workbooks and compiles
# every language; a markdown edit cannot change what it answers, and it used to spend
# the whole matrix finding that out. `paths-ignore` rather than `paths`, so anything not
# named here still runs it - a filter that has to be extended for new source is a filter
# that eventually stops covering something.
#
# The list is written twice because GitHub does not resolve YAML anchors in a workflow file.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'spec/**'
      - 'samples/*/doc/**'
      - 'website/**'
      - 'brand/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'spec/**'
      - 'samples/*/doc/**'
      - 'website/**'
      - 'brand/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  # For the cross-platform job, which no longer runs on every push - see its comment.
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

# A push that supersedes another makes the first one's answer worthless, and this suite is
# expensive enough that paying for both is a decision rather than an accident.
concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The SDK band is pinned in global.json; this keeps the runner in step
          # with local builds instead of hardcoding a version in two places.
          global-json-file: global.json

      # The regression suite type-checks the generated TypeScript with the real
      # compiler, which is how several long-standing codegen defects surfaced. That
      # test fails rather than skips when no toolchain is present, so Node is not
      # optional here.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The tests reach the compiler through `npx tsc`, and npx on a runner with nothing
      # installed answers "This is not the tsc command you are looking for" rather than
      # fetching it - so every TypeScript gate failed on the toolchain instead of on the
      # code. Installed globally and pinned, so a compiler release cannot change what the
      # gate means without somebody choosing it.
      - name: Setup TypeScript
        run: |
          npm install -g typescript@5.8.3
          npx tsc --version

      # The suite compiles the generated C++, C and C# and runs all three against
      # the exported binary tables, which is what checks that each reader still
      # agrees with the writer about the byte format. ubuntu-latest ships both.
      #
      # The generated C header is also compiled as C++, because it declares
      # `extern "C"` - and a member named `class` is good C and stops a C++
      # compiler dead, which the C build cannot see.
      - name: Verify C and C++ toolchains
        run: |
          g++ --version
          gcc --version

      # The C and C++ updaters are the only emitted files that link against anything.
      # Neither language has an HTTP client, so both use libcurl and both say so - and the
      # gate that builds them fails rather than skips, like every other language gate here.
      - name: Setup libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          curl-config --version

      # The retired-name check moved to its own workflow, so that a documentation-only change
      # - which this one no longer runs for - is still covered by it.

      - name: Restore
        run: dotnet restore Tabbit.slnx

      - name: Build
        run: dotnet build Tabbit.slnx --no-restore -c Release

      # No "fixtures are up to date" check here on purpose. .xlsx files are zip
      # archives that embed per-entry timestamps, so regenerating them produces
      # different bytes every time and any such check would fail on every run.
      #
      # What matters is covered anyway: the suite converts the committed workbooks
      # and compares every artifact against the golden tree, so a fixture that no
      # longer produces the expected output fails here regardless.

      # The database exporters are tested against real engines, which the test fixture
      # starts itself with docker compose. ubuntu-latest ships a working Docker.
      # The conformance corpus is read by every language whose reader is checked, and a
      # missing toolchain fails rather than skips - a gate that turns itself off is worse
      # than no gate.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Rust toolchain
        run: cargo --version

      # Ruby ships on ubuntu-latest, so this only records which one the run used.
      - name: Verify Ruby toolchain
        run: ruby --version

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6'

      # PHP 8.1 at least: the generated code uses backed enums and typed properties.
      # ubuntu-latest ships one, but not a version this can rely on, so it is pinned.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Kotlin has no first-party action. The harness compiles through
      # lib/kotlin-compiler.jar rather than the launcher script, so unpacking the
      # release and putting its bin directory on the path is all that is needed - the
      # runner finds the jar beside whichever launcher it sees.
      - name: Setup Kotlin
        run: |
          curl -sSLo kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin-compiler.zip -d "$HOME/tools"
          echo "$HOME/tools/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Verify Kotlin toolchain
        run: kotlinc -version

      # Swift has no first-party action either. The conformance harness builds through
      # SwiftPM with swift-crypto - the corpus is signed and verifying a MAC needs
      # HMAC-SHA-256 - and a second gate type-checks the same output with no package at
      # all, which is the state a consumer who adds nothing gets.
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - name: Verify Swift toolchain
        run: swift --version

      # The history is recorded into and read back from MySQL, and `--serve` is checked
      # against a real port. Both use the same compose file the exporter tests bring up,
      # so Docker is what they need and nothing else.
      - name: Verify Docker
        run: docker version --format '{{.Server.Version}}'

      - name: Test
        run: dotnet test Tabbit.slnx --no-build -c Release --verbosity normal

      # The serve mode brings in an ASP.NET Core framework reference, which means a
      # framework-dependent deployment needs that runtime rather than the base one. The
      # answer offered in the README is a self-contained publish, so it is built and run
      # here - an answer nothing exercises is a guess.
      - name: Publish self-contained
        run: >
          dotnet publish src/Tabbit.csproj -c Release -r linux-x64
          --self-contained true -o published

      - name: Run the published binary
        run: |
          ./published/tabbit --recipe test/fixtures/recipes/core.json --silent
          ./published/tabbit --new-recipe "$RUNNER_TEMP/recipe.json"

          # Validation compiles C# at run time, so it needs the metadata of every assembly a
          # rule may name - and a single-file publish has no path to read one from. The tool
          # carries them instead, and this is the only shape in which that is exercised: every
          # other run in this workflow reads them off disk and would pass either way.
          ./published/tabbit --recipe test/fixtures/recipes/validation-pass.json --validate-only

          # Nothing beside the executable but its native dependencies: a stray .pdb here
          # was 83 MB, more than everything else together.
          echo "published files:"
          ls -la published

  # The same tool on the other two operating systems.
  #
  # The job above is the whole suite and runs only on Linux, which is what let a Windows-only
  # assumption sit in the build for as long as nobody built anywhere else: the netstandard2.1
  # reference assemblies are laid down under `packs` by the Windows SDK installer and left to
  # NuGet everywhere else, and the tool could not be compiled at all off Windows because of it.
  # That is a first-line-of-the-build failure, and no amount of test coverage on one platform
  # sees it.
  #
  # 916 of the 999 tests: every one that does not need a database. The 83 left out are named
  # below rather than pattern-matched, so a new gate has to be added to that list deliberately
  # instead of falling out of it by how somebody spelled a class name.
  #
  # It costs the same toolchains the Linux job installs, on two more runners. That is the price
  # of the conformance corpus meaning anything here: a reader is 13 separate implementations of
  # one binary format, and "they agree with the writer on Linux" is not the claim it makes.
  #
  # **Not on every push.** GitHub bills a Windows minute as two and a macOS minute as ten, so
  # this matrix was about 480 of the 520 minutes a push cost - and it exhausted the account,
  # which stopped the Linux job from running at all. A gate nobody can pay for is not a gate.
  #
  # Weekly, on a pull request, and on demand. What that gives up is naming the push that broke
  # a platform: a Sunday failure covers a week of commits, and finding which one is then a
  # bisect rather than a glance. That is the trade, and `workflow_dispatch` is how to close it
  # for a change that looks platform-shaped - anything touching the toolchain harnesses, the
  # emitted C or C++, or a path.
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'push'

    # One platform failing should not hide whether the other is fine.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup TypeScript
        shell: bash
        run: |
          npm install -g typescript@5.8.3
          npx tsc --version

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6'

      # Kotlin has no first-party action. Unpacked into `<home>/tools`, which is one of the
      # places the harness looks: it compiles through `kotlin-compiler.jar` rather than the
      # launcher, so nothing has to go on the PATH.
      - name: Setup Kotlin
        if: runner.os == 'macOS'
        run: |
          curl -sSLo kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin-compiler.zip -d "$HOME/tools"

      - name: Setup Kotlin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip" -OutFile kotlin-compiler.zip
          Expand-Archive kotlin-compiler.zip -DestinationPath "$env:USERPROFILE/tools" -Force

      # macOS gets Swift from Xcode, so only Windows has anything to install. The Windows
      # toolchain needs the Visual Studio C++ tools and a Windows SDK that still ships
      # `stdnoreturn.h` - Swift's ucrt module map references it, and an SDK without it fails
      # as a missing C header rather than as a missing toolchain.
      # doc/languages/swift.md has that trap written down.
      #
      # The Windows job asked for 6.1 and the action answered `Version "6.1" is not
      # available` - it publishes a different set per platform. `6` takes whatever 6.x that
      # platform has, which is what this gate wants: it checks that the emitted Swift builds
      # under a current toolchain, not under one exact patch of it.
      - name: Setup Swift
        if: runner.os == 'Windows'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6'

      # The C and C++ updaters are the only emitted files that link against anything, and
      # neither language has an HTTP client. macOS carries libcurl in its SDK and `-lcurl` is
      # the whole of it; Windows has no such place, so the gate is pointed at a vcpkg prefix.
      - name: Setup libcurl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install curl:x64-windows
          echo "TABBIT_LIBCURL_ROOT=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"

      # Records what the run used. Windows ships MSVC, which the suite finds through
      # vcvars64.bat; macOS ships clang, which answers to `g++` and `gcc` - and that difference
      # is not cosmetic. clang rejects what gcc allows, which is how the shipped C updater
      # turned out not to compile on a Mac at all.
      - name: Report the toolchains
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            g++ --version
            gcc --version
          else
            echo "MSVC, located by the suite through vcvars64.bat"
          fi

          go version
          javac -version
          cargo --version
          ruby --version
          php --version | head -1
          dart --version
          swift --version

      - name: Build
        run: dotnet build Tabbit.slnx -c Release

      # Everything but the gates that need a database. Those bring MySQL, PostgreSQL, MongoDB
      # and Redis up with `docker compose`, and a macOS runner has no Docker to do it with - a
      # job that fails on the runner rather than on the code is a job people learn to ignore.
      - name: Test
        shell: bash
        run: >
          dotnet test Tabbit.slnx --no-build -c Release --verbosity normal --filter
          "FullyQualifiedName!~DatabaseExportTests&FullyQualifiedName!~HistoryCommandTests&FullyQualifiedName!~HistoryServerTests&FullyQualifiedName!~HistoryStoreTests&FullyQualifiedName!~HistoryQueryTests&FullyQualifiedName!~ValidationRuntimeTests"

      # The build scripts are how a person builds this, and the shell ones did not run at all:
      # the committed mode was 644, so the shebang never got a chance, and the line after the
      # publish renamed an output spelled `tabbit` to one spelled `Tabbit` - the same file on
      # NTFS and no file at all on ext4. Nothing ran them, so nothing said so.
      - name: The platform's own build script
        if: runner.os == 'macOS'
        run: |
          ./build/build-osx64.sh
          ./bin/osx-arm64/tabbit --recipe test/fixtures/recipes/core.json --silent

      - name: The platform's own build script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/build-win64.ps1 win-x64
          ./bin/win-x64/tabbit.exe --recipe test/fixtures/recipes/core.json --silent
