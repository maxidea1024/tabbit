name: Names

# The product had another name once, and its binary format had another one too. Both are gone
# from every file, and this is what keeps them gone: a name leaks back the way it leaked out the
# first time - through a path, a comment, a fixture nobody reads.
#
# Its own workflow rather than a step in the .NET one, because that one no longer runs for a
# documentation-only change - and prose is exactly where a retired name comes back. This costs
# a checkout and a grep, so it can afford to run for everything.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  names:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Tracked files only, and contents as well as paths. The workbooks are excluded because
      # they are zip archives whose deflate output contains three-letter sequences by chance;
      # every hit inside one so far has been surrounded by binary noise. This file is excluded
      # because the names it forbids have to be written down somewhere, and this is that place.
      - name: No trace of the old names
        run: |
          # Matched case-insensitively, so one spelling of each covers SheetMan, Sheetman,
          # SHEETMAN, ScbReader, scb_reader and `.scb` alike.
          # The last branch is the signature spelled a character at a time:
          # `'S' 'C' 'B' 0` sat in ten runtime readers for months, because no
          # word-boundary match can see letters that quotes hold apart.
          old="sheetman|sheet[ -]man|시트맨|\bscb|'s' 'c' 'b'"

          paths="$(git ls-files | grep -Ei 'sheetman|scb' || true)"
          if [ -n "$paths" ]; then
            echo "::error::these paths carry a retired name"; echo "$paths"; exit 1
          fi

          files="$(git grep -lEIi "$old" -- . ':(exclude)*.xlsx' ':(exclude)*.xlsm' ':(exclude)*.xlsb' ':(exclude).github/workflows/names.yml' || true)"
          if [ -n "$files" ]; then
            echo "::error::these files carry a retired name"
            git grep -nEIi "$old" -- . ':(exclude)*.xlsx' ':(exclude)*.xlsm' ':(exclude)*.xlsb' ':(exclude).github/workflows/names.yml'
            exit 1
          fi

          echo "clean"

      # Sample data is synthetic and stays that way - CLAUDE.md says what that means and
      # where the line is. There is no word list here on purpose: a list of forbidden names
      # is a list of what used to be in the repository, which is the thing it would protect.
      # What a gate can see is the shape, and this is the shape that matters.
      - name: Samples carry no foreign workbooks
        run: |
          books="$(git ls-files | grep -Ei '\.(xlsx|xlsm|xlsb)$' | grep -vE '^(test/fixtures/|tools/mabbit/test/fixtures/|samples/(sprout|canopy|wildling|clover)/)' || true)"
          if [ -n "$books" ]; then
            echo "::error::these workbooks are outside the synthetic samples and the fixtures"
            echo "$books"; exit 1
          fi

          echo "clean"

      # Folder and file names are ASCII. Prose is Korean throughout and that is deliberate; a
      # path is not prose - it is typed into shells, URLs and build scripts on three operating
      # systems, and one of them will get the encoding wrong.
      #
      # Any byte outside ASCII, rather than the Hangul ranges: the rule is what a path may
      # contain, and a range list would be a rule about what it may not.
      - name: Paths are ASCII
        run: |
          paths="$(LC_ALL=C git ls-files | grep -P '[^\x00-\x7F]' || true)"
          if [ -n "$paths" ]; then
            echo "::error::these paths are not ASCII"; echo "$paths"; exit 1
          fi

          echo "clean"
