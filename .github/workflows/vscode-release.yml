name: vscode release

# Releases the editor extension on its own tag, apart from the tool's.
#
# **Apart, because the two do not change together.** A fix to the highlighting grammar or to
# `extension.ts` is not a reason to build six platform binaries and cut a tool release, and a
# tool release is not a reason to hand people a `.vsix` that has not changed. The one thing
# they share is the protocol, and that is what the server's capabilities negotiate.
#
# The tag is `tbs-v*` rather than `v*`. It has to not begin with `v`: the tool's release
# workflow triggers on `v*`, and `vsix-v1.0.0` would match it - so pushing an extension tag
# would cut a tool release too.
#
# The version is taken from the tag and written into the package on the command line only.
# `package.json` keeps whatever it says, the same way the tool's `.csproj` carries no version:
# what a release is called is decided by the release, not by a file somebody has to remember
# to bump.

on:
  push:
    tags:
      - 'tbs-v*'

  # So the whole thing can be rehearsed without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, such as 0.0.2. Uploads nothing; artifact only.'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: tools/vscode

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: tools/vscode/yarn.lock

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#tbs-v}"
          fi

          # An extension version is three numbers and nothing else - `vsce` refuses anything
          # else, so a suffix is caught here rather than after the build.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a version an extension may carry. Tag it tbs-vX.Y.Z."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Frozen, so a lockfile that has drifted from the manifest fails here rather than
      # quietly resolving to something nobody has run.
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: Package
        run: |
          node esbuild.mjs
          yarn vsce package "${{ steps.version.outputs.version }}" --no-update-package-json --no-git-tag-version --no-dependencies

      # So somebody who downloads it over an unknown network can tell whether they got what
      # was published.
      - name: Checksum
        run: sha256sum ./*.vsix | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: tabbit-tbs-${{ steps.version.outputs.version }}
          path: |
            tools/vscode/*.vsix
            tools/vscode/SHA256SUMS
          if-no-files-found: error

      # A rehearsal stops here. Everything worth rehearsing has already happened.
      #
      # The notes are written out rather than generated. GitHub generates them from the
      # commits since the previous release, and the previous release is usually the tool's -
      # so a generated list would be every change to the converter with the extension's
      # somewhere inside it.
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          files: |
            tools/vscode/*.vsix
            tools/vscode/SHA256SUMS
          name: VS Code 확장 ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            `.tbs` 스키마 파일의 VS Code 확장입니다 — 문법 강조 · 진단 · 정의로 이동 ·
            호버 · 자동완성 · 시맨틱 토큰.

            ```
            code --install-extension tabbit-tbs-${{ steps.version.outputs.version }}.vsix
            ```

            **진단과 이동은 확장이 판정하지 않습니다.** `tabbit lsp` 가 변환과 같은 파서를
            돌려 답하므로 [tabbit](https://github.com/maxidea1024/tabbit/releases)이 설치되어
            있어야 합니다. 확장은 설정 → `PATH` → 저장소의 빌드 산출물 순으로 찾습니다.

            쓰는 법은 [편집기](https://github.com/maxidea1024/tabbit/blob/main/doc/editor.md),
            설계는 [편집기 지원](https://github.com/maxidea1024/tabbit/blob/main/spec/ops/lsp.md).
