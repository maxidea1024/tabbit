# 일회용. Windows 러너에 Swift 를 winget 으로 넣었을 때 어디에 놓이는지 확인하려고 둔 것이고,
# 확인하면 지운다.
name: swift-probe-win

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: winget 설치
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain -e --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: 어디에 놓였나
        shell: pwsh
        run: |
          foreach ($root in @("$env:LOCALAPPDATA\Programs\Swift", 'C:\Program Files\Swift', 'C:\Library')) {
            if (Test-Path $root) {
              Write-Host "--- $root"
              Get-ChildItem -Path $root -Recurse -Filter swift.exe -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          }

      - name: 그것으로 빌드까지
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs\Swift", 'C:\Program Files\Swift' `
                   -Recurse -Filter swift.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'Toolchains' } | Select-Object -First 1
          if (-not $exe) { throw '툴체인을 찾지 못하였습니다' }
          Write-Host "swift: $($exe.FullName)"
          & $exe.FullName --version
          $bin = Split-Path $exe.FullName
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\p\tabbit" | Out-Null
          Copy-Item lib\swift\tabbit\*.swift "$env:RUNNER_TEMP\p\tabbit\"
          Copy-Item test\fixtures\tools\conformance\swift\Package.swift "$env:RUNNER_TEMP\p\Package.swift"
          (Get-Content "$env:RUNNER_TEMP\p\Package.swift") `
            -replace 'name: "harness"', 'name: "probe"' `
            -replace '\.executableTarget', '.target' `
            -replace '"(ConformanceData\.swift|tables|enums|constants|main\.swift)",', '' |
            Set-Content "$env:RUNNER_TEMP\p\Package.swift"
          Push-Location "$env:RUNNER_TEMP\p"
          & $exe.FullName build
          Pop-Location
