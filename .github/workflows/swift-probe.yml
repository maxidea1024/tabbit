# 일회용. macOS 에서 Swift 적합성 하네스가 실제로 어떤 매니페스트로 빌드되는지 확인하려고 둔 것이고,
# 원인을 확인하면 지운다.
name: swift-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Swift 적합성 게이트만
        id: gate
        continue-on-error: true
        run: dotnet test --filter "FullyQualifiedName~Generated_swift_reader_matches_the_corpus"

      - name: 그 자리에 놓인 매니페스트
        if: always()
        run: |
          root=test/fixtures/output/_lang/conformance/swift
          ls -la "$root" || true
          echo "===== $root/Package.swift ====="
          cat "$root/Package.swift" || echo "(없음)"
          echo "===== 트리 안의 다른 Package.swift ====="
          find test/fixtures/output -name Package.swift -not -path '*/.build/*' || true
